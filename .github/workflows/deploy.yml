name: Deploy worker

on:
    push:
        branches: ["main"]

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production
        name: Deploy
        steps:
            
            - name: Check Cloudflare secrets
              run: |
                if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
                  echo "API token NO disponible"
                  exit 1
                fi

                if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
                  echo "Account ID NO disponible"
                  exit 1
                fi

                echo "Secrets disponibles correctamente"
              env:
                CLOUDFLARE_API_TOKEN: ${{ secrets.production.CLOUDFLARE_API_TOKEN }}
                CLOUDFLARE_ACCOUNT_ID: ${{ secrets.production.CLOUDFLARE_ACCOUNT_ID }}

            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 10

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "pnpm"


            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build
            
            
            - name: Deploy to Cloudflare Workers
              run: pnpm exec wrangler deploy
              env:
                CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            
